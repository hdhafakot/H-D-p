<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>H&D Productions</title><style>:root{font-family:Arial,sans-serif;color:#18283b;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:#142c4b;color:white;padding:18px 22px;display:flex;justify-content:space-between;align-items:center}main{max-width:1100px;margin:auto;padding:16px}.card{background:white;border:1px solid #dde4ed;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 3px 12px #142c4b0b}h1{font-size:22px;margin:0}h2{font-size:19px}label{font-size:13px;font-weight:bold;display:block;margin:10px 0 5px}input,select,textarea{font:inherit;width:100%;border:1px solid #b8c7d8;border-radius:9px;padding:11px;background:white}button{font:inherit;border:0;border-radius:9px;background:#175aa2;color:white;padding:11px 16px;cursor:pointer;margin:4px 0}button.secondary{background:#e8eef6;color:#1a3658}button.danger{background:#a83030}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.hide{display:none!important}.muted{color:#63748a;font-size:13px}.order{border-bottom:1px solid #e4e9f1;padding:12px 0}.notice{padding:12px;border-radius:9px;background:#fff5dc}.error{background:#ffe8e8}.ok{background:#e7f8ee}.toolbar{display:flex;flex-wrap:wrap;gap:8px}.check{display:flex;align-items:center;gap:8px}.check input{width:auto}#msg{position:sticky;top:0;z-index:3}.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse}td,th{padding:9px;text-align:right;border-bottom:1px solid #eee}@media(max-width:650px){.grid,.three{grid-template-columns:1fr}header{padding:15px}main{padding:10px}.card{padding:14px}} </style></head><body><header><h1>H&D Productions</h1><span id="identity">מערכת צוות</span></header><main><div id="msg"></div><section id="login" class="card"><h2>כניסת עובדים</h2><form id="loginForm"><label>מספר טלפון<input name="phone" required autocomplete="username"></label><label>סיסמה<input type="password" name="password" required autocomplete="current-password"></label><button>התחברות</button></form></section><section id="app" class="hide"><div class="toolbar"><button class="secondary" onclick="tab('orders')">הזמנות</button><button class="secondary" onclick="tab('new')">הזמנה חדשה</button><button class="secondary" onclick="tab('events')">אירועים</button><button class="secondary" id="usersTab" onclick="tab('users')">עובדים</button><button class="secondary" onclick="logout()">התנתקות</button></div><section id="orders" class="card"><h2>הזמנות</h2><input id="search" placeholder="חיפוש לקוח, טלפון או מספר הזמנה" oninput="renderOrders()"><div id="ordersList"></div></section><section id="new" class="card hide"><h2>פתיחת הזמנה</h2><form id="orderForm"><div class="grid"><label>אירוע<select name="event_id" id="eventSelect" required></select></label><label>שם לקוח<input name="customer" required></label><label>טלפון<input name="phone"></label><label>מספר אורחים<input type="number" min="1" value="1" name="guests" required></label><label>חדר / פרטים<input name="room"></label><label>סכום ההזמנה ₪<input type="number" min="0" step="0.01" value="0" name="amount"></label><label id="ownerLabel" class="hide">עובד אחראי<select id="ownerSelect" name="owner_id"></select></label></div><button>שמירת הזמנה</button></form></section><section id="events" class="card hide"><h2>אירועים</h2><div id="eventsList"></div><form id="eventForm" class="hide"><h3>אירוע חדש</h3><div class="grid"><label>שם אירוע<input name="title" required></label><label>מיקום<input name="venue"></label><label>תאריך<input type="date" name="date"></label><label>קיבולת<input type="number" min="0" name="capacity" value="0"></label></div><button>יצירת אירוע</button></form></section><section id="users" class="card hide"><h2>עובדים</h2><div id="usersList"></div><form id="userForm"><div class="grid"><label>שם<input name="name" required></label><label>טלפון<input name="phone" required></label><label>סיסמה ראשונית (10 תווים לפחות)<input type="password" name="password" minlength="10" required></label></div><button>הוספת עובד</button></form></section><section id="detail" class="card hide"><button class="secondary" onclick="tab('orders')">חזרה להזמנות</button><div id="detailContent"></div></section></section></main><script>
let me=null,orders=[],events=[],users=[],selected=null;const $=id=>document.getElementById(id);const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n||0).toLocaleString('he-IL');async function api(url,opt={}){const r=await fetch('/api'+url,{credentials:'same-origin',...opt,headers:{...(opt.body instanceof FormData?{}:{'Content-Type':'application/json'}),...(opt.headers||{})}});let x=await r.json().catch(()=>({}));if(!r.ok)throw Error(typeof x.detail==='string'?x.detail:'פעולה נכשלה');return x}function toast(s,err=false){$('msg').innerHTML=`<div class="notice ${err?'error':'ok'}">${safe(s)}</div>`;setTimeout(()=>$('msg').innerHTML='',5500)}function tab(id){for(let x of ['orders','new','events','users','detail'])$(x).classList.toggle('hide',x!==id);if(id==='orders')refresh()}async function boot(){try{me=await api('/me');$('login').classList.add('hide');$('app').classList.remove('hide');$('identity').textContent=me.name+' · '+(me.role==='admin'?'מנהלת':'עובד');$('usersTab').classList.toggle('hide',me.role!=='admin');$('eventForm').classList.toggle('hide',me.role!=='admin');$('ownerLabel').classList.toggle('hide',me.role!=='admin');await refresh()}catch{$('login').classList.remove('hide');$('app').classList.add('hide')}}async function refresh(){events=await api('/events');orders=await api('/orders');if(me.role==='admin')users=await api('/users');$('eventSelect').innerHTML=events.map(e=>`<option value="${e.id}">${safe(e.title)} · ${safe(e.date)}</option>`).join('');$('ownerSelect').innerHTML=users.filter(u=>u.active).map(u=>`<option value="${u.id}">${safe(u.name)}</option>`).join('');$('eventsList').innerHTML=events.map(e=>`<p>${safe(e.title)} — ${safe(e.date)} — ${safe(e.venue)}</p>`).join('')||'אין אירועים';$('usersList').innerHTML=users.map(u=>`<p>${safe(u.name)} · ${safe(u.phone)} · ${u.active?'פעיל':'מושבת'} ${u.active&&u.id!==me.id?`<button class="danger" onclick="disableUser(${u.id})">השבתה</button>`:''}</p>`).join('');renderOrders()}function renderOrders(){let q=$('search').value.trim();$('ordersList').innerHTML=orders.filter(o=>(o.customer+' '+o.phone+' '+o.id).includes(q)).map(o=>`<div class="order"><b>#${o.id} · ${safe(o.customer)}</b><div class="muted">${safe(o.event_title)} · ${safe(o.owner_name)} · ${safe(o.status)} · ${o.guests} אורחים</div><div>₪${money(o.paid)} מתוך ₪${money(o.amount)}</div><button onclick="openOrder(${o.id})">ניהול הזמנה וכרטיסים</button></div>`).join('')||'<p>לא נמצאו הזמנות</p>'}async function openOrder(id){selected=orders.find(o=>o.id===id);if(!selected)return;let o=selected,a=await api(`/orders/${id}/admissions`);window._admissions=a;$('detailContent').innerHTML=`<h2>הזמנה #${o.id} – ${safe(o.customer)}</h2><p>${safe(o.event_title)} | ${o.guests} אורחים | ${safe(o.status)}</p><div class="toolbar"><button onclick="setStatus('confirmed')">אישור הזמנה</button><button class="secondary" onclick="setStatus('pending')">ממתינה</button><button class="danger" onclick="setStatus('cancelled')">ביטול</button><button class="secondary" onclick="voucher()">שובר אירוח</button></div><h3>תשלום ידני</h3><p>שולם ₪${money(o.paid)} | יתרה ₪${money(o.amount-o.paid)}</p><form id="payForm"><div class="grid"><label>סכום<input name="amount" type="number" step="0.01" min="0.01" required></label><label>אמצעי<select name="method"><option value="bank">העברה</option><option value="bit">ביט</option><option value="cash">מזומן</option><option value="other">אחר</option></select></label><label>הערה<input name="note"></label></div><button>רישום תשלום</button></form><h3>כרטיסי כניסה אישיים</h3><p class="muted">אזור A – אדם עם מוגבלות | B – ילד | C – מבוגר | VIP – קבוצת מלון, ישיבה סביב שולחנות</p><div id="admissionsList">${a.map(x=>`<div class="order"><b>${safe(x.guest_name)}</b> · ${x.identity_recorded?"ת.ז נקלטה":"ת.ז חסרה"} · ${safe(x.zone)} · ${safe(x.entry_type==='26'?'26.11':'26–27.11')} · ${safe(x.seat)} ${x.age!==null&&x.age<18?`<div>מסמך הורה: ${x.document_uploaded?'צורף':'חסר'}</div><form class="uploadForm" data-id="${x.id}"><input type="file" name="document" accept="image/jpeg,image/png,application/pdf" required><button>צירוף תעודה וספח</button></form>`:''}<button class="secondary" onclick="window.open('/api/admissions/${x.id}/pass','_blank')">הפקת שובר כניסה</button>${x.age!==null&&x.age<18||x.eilat_resident&&x.age!==null&&x.age<16?`<button class="secondary" onclick="sendParentDocs(${x.id})">הנחיות לשליחה בוואטסאפ</button>`:''}</div>`).join('')||'עדיין אין כרטיסים'}</div><h3>הוספת אורח / כרטיס</h3><form id="admissionForm"><div class="grid"><label>שם האורח<input name="guest_name" required></label><label>מספר תעודת זהות של האורח<input name="identity_number" inputmode="numeric" pattern="[0-9]{9}" maxlength="9" autocomplete="off" required></label><label>גיל<input name="age" type="number" min="0" max="120" required></label><label>תושבות<select name="eilat_resident"><option value="false">לא תושב אילת</option><option value="true">תושב אילת</option></select></label><label>אזור<select name="zone" id="zone"><option value="A">A – אדם עם מוגבלות</option><option value="B">B – ילד</option><option value="C" selected>C – מבוגר</option><option value="VIP">VIP – קבוצת המלון</option></select></label><label>ימי כניסה<select name="entry_type"><option value="26">26.11.2026 בלבד</option><option value="26-27">26–27.11.2026</option></select></label><label>שעת תחילת אירוע<input name="event_time" type="time"></label><label>כיסא<input name="seat"></label><label>מספר / שם שולחן VIP<input name="table_name"></label></div><label>הערות נוספות<textarea name="notes"></textarea></label><div id="guardian" class="notice hide"><b>הצהרת הורה לקטין מתחת לגיל 18</b><p>אני ההורה/האפוטרופוס מסכים/ה להשתתפות הקטין באירוע ולוקח/ת אחריות בהתאם לדין. יש לצרף תעודה מזהה וספח.</p><label>שם ההורה<input name="guardian_name"></label><label>תעודת זהות הורה<input name="guardian_identity_number" inputmode="numeric" pattern="[0-9]{9}" maxlength="9" autocomplete="off"></label><label>חתימה דיגיטלית – הקלדת שם מלא<input name="guardian_signature"></label><label class="check"><input type="checkbox" name="guardian_consent"> אני מאשר/ת את ההצהרה</label></div><p class="muted">תושבי אילת: יש להציג תעודה מזהה בכניסה. לילד מתחת לגיל 16 – תעודת הורה וספח. יש לשלוח מסמכים לוואטסאפ 0504313030 בצירוף שם המזמין; לקטין מתחת לגיל 18 יש לצרף גם הצהרת הורה חתומה. השליחה מתבצעת ידנית בוואטסאפ.</p><button>שמירת כרטיס</button></form>`;tab('detail');$('payForm').onsubmit=async ev=>{ev.preventDefault();await act(()=>api(`/orders/${id}/payments`,{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(ev.target)))}),()=>openOrder(id))};$('admissionForm').onsubmit=async ev=>{ev.preventDefault();let d=Object.fromEntries(new FormData(ev.target));d.order_id=id;d.age=Number(d.age);d.eilat_resident=d.eilat_resident==='true';d.guardian_consent=!!d.guardian_consent;if(d.age<18&&!d.guardian_identity_number){toast('יש להזין תעודת זהות של הורה',true);return;}await act(()=>api('/admissions',{method:'POST',body:JSON.stringify(d)}),()=>openOrder(id))};$('admissionForm').elements.age.oninput=ev=>$('guardian').classList.toggle('hide',Number(ev.target.value)>=18||!ev.target.value);document.querySelectorAll('.uploadForm').forEach(f=>f.onsubmit=async ev=>{ev.preventDefault();await act(()=>api(`/admissions/${f.dataset.id}/document`,{method:'POST',body:new FormData(f)}),()=>openOrder(id))})}async function act(fn,done){try{await fn();toast('נשמר בהצלחה');await refresh();if(done)await done()}catch(e){toast(e.message,true)}}async function setStatus(s){await act(()=>api(`/orders/${selected.id}/status`,{method:'POST',body:JSON.stringify({status:s})}),()=>openOrder(selected.id))}async function voucher(){try{let v=await api(`/orders/${selected.id}/voucher`);let admissions=await api(`/orders/${selected.id}/admissions`);let secondDay=admissions.some(a=>a.entry_type==='26-27'||a.zone==='VIP');let footer=admissions.map(a=>`<p><b>${safe(a.guest_name)}:</b> ${safe(a.notes||'אין הערות נוספות')}${a.eilat_resident?' · תושב אילת: הצגת תעודה מזהה; מתחת לגיל 16 – תעודת הורה וספח לוואטסאפ 0504313030 בצירוף שם המזמין.':''}${a.age!==null&&a.age<18?' · קטין: הצהרת הורה חתומה ותעודה וספח לוואטסאפ 0504313030 בצירוף שם המזמין.':''}</p>`).join('');let w=window.open('','_blank');w.document.write(`<html lang="he" dir="rtl"><meta charset="utf-8"><body style="font-family:Arial;padding:40px"><h1>H&D Productions – שובר אירוח</h1><h2>${safe(v.event.title)}</h2><p>הזמנה: ${v.order.id} · ${safe(v.order.customer)}</p><p>תאריך: ${safe(v.event.date)} · ${safe(v.event.venue)}</p><p>אורחים: ${v.order.guests} · חדר: ${safe(v.order.room)}</p><p>שולם: ₪${money(v.paid)}</p><hr>${secondDay?'<p><b>יום שישי 27.11.2026: 11:30–15:00</b></p>':''}<h3>הערות והנחיות – בסוף השובר</h3>${footer||"אין הערות נוספות"}<p><b>קוד לבוש: לבן 🤍</b></p><p>הנהלת ההפקה שומרת לעצמה את הזכות לשנות את מיקום האירוע ו/או סידורי הישיבה בהתאם לצרכיה.</p><p>השובר אישי, שמי ואינו ניתן להעברה או לביטול, בכפוף להוראות הדין.</p><p>הכניסה מותנית בשובר תקף ובתעודה מזהה בהתאם להנחיות.</p><p><b>בילוי מהנה! H&amp;D Productions – חברים • מוזיקה • חוויה</b></p><button onclick="print()">הדפסה</button></body></html>`);w.document.close()}catch(e){toast(e.message,true)}}function sendParentDocs(id){let a=window._admissions||[];let x=a.find(y=>y.id===id);if(!x)return;let name=selected?.customer||'';let msg=`שלום, מצורפים מסמכי הורה עבור האירוע 26–27.11.2026.\nשם המזמין: ${name}\nשם האורח/ת: ${x.guest_name}\nיש לצרף תעודה מזהה וספח, וכן מסמך הצהרת הורה חתום לקטין מתחת לגיל 18.`;window.open('https://wa.me/972504313030?text='+encodeURIComponent(msg),'_blank');toast('יש לצרף את המסמכים ידנית בשיחת הוואטסאפ; הם לא נשלחו אוטומטית')}async function disableUser(id){if(confirm('להשבית עובד?'))await act(()=>api(`/users/${id}/disable`,{method:'POST'}))}async function logout(){await api('/logout',{method:'POST'});location.reload()}$('loginForm').onsubmit=async e=>{e.preventDefault();await act(()=>api('/login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))}),boot)};$('eventForm').onsubmit=async e=>{e.preventDefault();await act(()=>api('/events',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))}),()=>tab('events'))};$('orderForm').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.event_id=Number(d.event_id);d.guests=Number(d.guests);d.amount=Number(d.amount);if(d.owner_id)d.owner_id=Number(d.owner_id);await act(()=>api('/orders',{method:'POST',body:JSON.stringify(d)}),()=>tab('orders'))};$('userForm').onsubmit=async e=>{e.preventDefault();await act(()=>api('/users',{method:'POST',body:JSON.stringify({...Object.fromEntries(new FormData(e.target)),role:'staff'})}),()=>tab('users'))};boot();
</script></body></html>
